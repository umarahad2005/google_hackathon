# JVM args tuned for stability on memory-constrained Windows machines.
# The previous -Xmx2G + HeapDumpOnOutOfMemoryError caused the Gradle daemon
# to die with native OOM ("mmap failed to map ~264MB") during IDE sync.
# A 1536m heap fits alongside the native/Metaspace footprint, and dropping
# the heap-dump flag avoids multi-GB dumps that make OOM worse.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
# Pin this project's Gradle build to JDK 17 (Flutter + AGP 8.x target),
# independent of the machine's JAVA_HOME (which is JDK 23 for other work).
# Forward slashes on purpose: '\' is an escape char in .properties files.
org.gradle.java.home=C:/Program Files/Java/jdk-17
org.gradle.daemon=true
org.gradle.caching=true
android.useAndroidX=true
# Suppress upstream deprecation warnings from Flutter plugin and AGP that
# use the old Groovy space-assignment syntax (propName value). These are
# in third-party code (Flutter SDK / AGP internals) and cannot be fixed
# directly. They are scheduled for removal in Gradle 10.0, not Gradle 9.0.
# Ref: https://docs.gradle.org/8.14/userguide/upgrading_version_8.html#groovy_space_assignment_syntax
org.gradle.warning.mode=summary
